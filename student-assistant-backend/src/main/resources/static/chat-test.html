<!DOCTYPE html>
<html>
<head>
    <title>Student Assistant Chat Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

<h2>Real-Time Chat Test</h2>

<label>Sender Username:</label>
<input type="text" id="sender" placeholder="student1"><br><br>

<label>Receiver Username:</label>
<input type="text" id="receiver" placeholder="teacher1"><br><br>

<label>Message:</label>
<input type="text" id="message"><br><br>

<button onclick="connect()">Connect</button>
<button onclick="sendMessage()">Send</button>

<h3>Messages:</h3>
<ul id="messages"></ul>

<script>
    let stompClient = null;
    let isConnected = false;

    function connect() {

        if (isConnected) {
            alert("Already connected!");
            return;
        }

        let socket = new SockJS("http://localhost:8081/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {

            console.log("Connected: " + frame);

            let username = document.getElementById("sender").value;

            stompClient.subscribe("/topic/messages/" + username, function (message) {
                showMessage(JSON.parse(message.body));
            });

            isConnected = true;
            alert("Connected successfully!");
        });
    }

    function sendMessage() {

        if (!isConnected) {
            alert("Connect first!");
            return;
        }

        let sender = document.getElementById("sender").value;
        let receiver = document.getElementById("receiver").value;
        let content = document.getElementById("message").value;

        let chatMessage = {
            senderUsername: sender,
            receiverUsername: receiver,
            content: content
        };

        stompClient.send("/app/chat.send", {}, JSON.stringify(chatMessage));
    }

    function showMessage(message) {
        let messages = document.getElementById("messages");
        let li = document.createElement("li");
        li.appendChild(document.createTextNode(
            message.senderUsername + ": " + message.content
        ));
        messages.appendChild(li);
    }
</script>

</body>
</html>
